<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>낚시왕</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="game">

<h1>🎣 낚시왕</h1>

<div class="status">

<p>레벨 : <span id="level">1</span></p>
<p>골드 : <span id="gold">1000</span>G</p>
<p>낚시 힘 : <span id="power">10</span></p>

</div>


<div class="sea">

<div id="fish">
🐟
</div>

<div id="rod">
🎣
</div>

</div>


<h2 id="message">
물고기를 잡아보세요!
</h2>


<button id="fishBtn">
🎣 낚시하기
</button>


<div class="result">

<h3>최근 획득</h3>

<p id="catchFish">
없음
</p>

</div>


<div class="book">

<h3>🐟 물고기 도감</h3>

<p>
획득 :
<span id="bookCount">
0
</span>
/120
</p>

</div>


</div>



<script src="js/fish.js"></script>
<script src="js/save.js"></script>
<script src="js/game.js"></script>


</body>
</html>
